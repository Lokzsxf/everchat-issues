name: Idea
description: Suggest something new for Everchat, or a change.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The idea, and the moment in the game where it would help.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Screenshots, or other addons or games that do something similar.
